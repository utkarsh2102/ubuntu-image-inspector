name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pytest ruff
      - name: Lint
        run: ruff check collector/
      - name: Tests
        working-directory: collector
        run: python -m pytest tests/ -q

  parity:
    # The browser and the collector each implement the diff; this is the only
    # thing that keeps them honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diff parity (JS vs Python golden fixture)
        run: node --test site/tests/

  vendor:
    # Vendored assets must match upstream exactly, or the pin is meaningless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored uPlot digests
        run: |
          cd site/js/vendor/uplot
          sha256sum -c - <<'SUMS'
          19c8d4c6ad88929a79f4ae49d6f7161566dfd0ba3d15cc495e974f787eb78f1f  uPlot.iife.min.js
          df630c6a8d6f8eeaff264b50f73ce5b114f646ffd9a0bb74f049b0a00135fa04  uPlot.min.css
          SUMS
          curl -sLo /tmp/up.js  https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js
          curl -sLo /tmp/up.css https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css
          cmp uPlot.iife.min.js /tmp/up.js
          cmp uPlot.min.css     /tmp/up.css

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed data
        run: python collector/validate_data.py site/data
